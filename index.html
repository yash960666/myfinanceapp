function renderRetentionSummary() {
  const card = document.getElementById("retentionSummaryCard");
  if (!card) return;
  const r = getRetention();
  const modeLabel = { keep: "Keep My Data (no automatic deletion)", quarterly: "Quarterly (Every 3 Months)", custom: "Custom" }[r.mode];
  let html = `<div class="space-between"><span class="muted">Retention</span><strong>${modeLabel}</strong></div>`;
  if (r.mode === "quarterly") {
    html += `<div class="space-between" style="margin-top:6px"><span class="muted">Next Deletion</span><strong>${r.nextDeletionDate || "—"}</strong></div>`;
    html += `<div class="muted" style="margin-top:6px">Automatically removes transaction records older than 3 months. Categories, accounts, and planning data are never touched.</div>`;
  } else if (r.mode === "custom") {
    if (r.customRange) {
      html += `<div class="space-between" style="margin-top:6px"><span class="muted">Configured Range</span><strong>${r.customRange.from} → ${r.customRange.to}</strong></div>`;
    }
    html += `<div class="muted" style="margin-top:6px">Last run: ${r.customLastRunDate || "Never"}. Custom deletion only runs when you explicitly trigger it — never automatically.</div>`;
  } else {
    html += `<div class="muted" style="margin-top:6px">No transaction records will ever be deleted automatically.</div>`;
  }
  card.innerHTML = html;
}

function openReviewDataModal() {
  const r = getRetention();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  let listHtml, rangeLabel, deleteAction = null;

  if (r.mode === "quarterly") {
    const preview = previewQuarterlyDeletion();
    rangeLabel = `Records dated before ${preview.cutoff}`;
    listHtml = renderReviewList(preview.transactions);
  } else if (r.mode === "custom" && r.customRange) {
    const txns = transactionsInRange(r.customRange.from, r.customRange.to);
    rangeLabel = `Records from ${r.customRange.from} to ${r.customRange.to}`;
    listHtml = renderReviewList(txns);
    deleteAction = () => {
      if (!confirm(`Permanently delete ${txns.length} record(s) in this range? This cannot be undone.`)) return;
      const count = runCustomDeletion(r.customRange.from, r.customRange.to);
      overlay.remove();
      alert(`${count} record(s) deleted.`);
      renderRetentionSummary();
    };
  } else {
    rangeLabel = "";
    listHtml = `<p class="muted">Retention is set to "Keep My Data" — nothing is scheduled for deletion.</p>`;
  }

  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Review Data Before Deletion</h3>
      ${rangeLabel ? `<p class="muted" style="margin-top:0">${rangeLabel}</p>` : ""}
      <div style="max-height:300px;overflow-y:auto">${listHtml}</div>
      ${deleteAction ? `<button class="btn-primary" id="reviewExportBtn" style="width:100%;margin-top:12px">Export My Data First</button>
        <button class="btn-danger" id="reviewDeleteBtn" style="width:100%;margin-top:8px">Delete These Records Now</button>` : ""}
      <button class="btn-ghost" id="reviewCloseBtn" style="width:100%;margin-top:8px">Close</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("reviewCloseBtn").onclick = () => overlay.remove();
  const exportBtn = document.getElementById("reviewExportBtn");
  if (exportBtn) exportBtn.onclick = () => downloadBackupNow();
  const deleteBtn = document.getElementById("reviewDeleteBtn");
  if (deleteBtn) deleteBtn.onclick = deleteAction;
}
function renderReviewList(txns) {
  if (!txns.length) return `<p class="muted">No records match — nothing would be deleted.</p>`;
  const total = txns.reduce((s,t) => s + t.amount, 0);
  const rows = [...txns].sort((a,b) => a.date.localeCompare(b.date)).map(t => {
    const cat = getCategoryById(t.categoryId);
    return `<div class="space-between" style="padding:4px 0;border-bottom:1px solid var(--border)">
      <span class="muted">${t.date} · ${cat ? escapeHtml(cat.name) : t.type}</span>
      <span>₹${t.amount.toFixed(0)}</span>
    </div>`;
  }).join("");
  return `<p><strong>${txns.length} record(s)</strong> totaling <strong>₹${total.toFixed(0)}</strong></p>${rows}`;
}

function openChangeRetentionModal() {
  const r = getRetention();
  const state = { mode: r.mode, customFrom: (r.customRange && r.customRange.from) || "", customTo: (r.customRange && r.customRange.to) || "" };
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  document.body.appendChild(overlay);

  function render() {
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>Change Retention Settings</h3>
        <div class="onb-option-card ${state.mode === "keep" ? "selected" : ""}" id="crKeep">
          <strong>🗄️ Keep My Data</strong>
          <p class="muted" style="margin:4px 0 0">No automatic deletion.</p>
        </div>
        <div class="onb-option-card ${state.mode === "quarterly" ? "selected" : ""}" id="crQuarterly">
          <strong>🔁 Quarterly (Every 3 Months)</strong>
          <p class="muted" style="margin:4px 0 0">Auto-deletes transaction records older than 3 months. Turning this on schedules the first cleanup 3 months from today — nothing is deleted right now.</p>
        </div>
        <div class="onb-option-card ${state.mode === "custom" ? "selected" : ""}" id="crCustom">
          <strong>📅 Custom Range</strong>
          <p class="muted" style="margin:4px 0 0">Manually clear a specific date range whenever you choose to.</p>
          <div id="crCustomFields" class="${state.mode === "custom" ? "" : "hidden"}" style="margin-top:8px">
            <div class="date-range-row">
              <div><label style="margin-top:0">From</label><input type="date" id="crCustomFrom" value="${state.customFrom}" /></div>
              <div><label style="margin-top:0">To</label><input type="date" id="crCustomTo" value="${state.customTo}" /></div>
            </div>
          </div>
        </div>
        <button class="btn-accent" id="crSaveBtn" style="width:100%;margin-top:10px">Save</button>
        <button class="btn-ghost" id="crCancelBtn" style="width:100%;margin-top:8px">Cancel</button>
      </div>`;
    document.getElementById("crKeep").onclick = () => { state.mode = "keep"; render(); };
    document.getElementById("crQuarterly").onclick = () => { state.mode = "quarterly"; render(); };
    document.getElementById("crCustom").onclick = () => { state.mode = "custom"; render(); };
    document.getElementById("crCancelBtn").onclick = () => overlay.remove();
    document.getElementById("crSaveBtn").onclick = () => {
      if (state.mode === "keep") {
        setRetentionKeep();
        overlay.remove();
        renderRetentionSummary();
        return;
      }
      if (state.mode === "quarterly") {
        if (!confirm(`Enable automatic Quarterly deletion? Transaction records older than 3 months will be deleted every 3 months from today (starting ${addMonths(todayISO(),3)}). This does not delete anything right now.`)) return;
        setRetentionQuarterly();
        overlay.remove();
        renderRetentionSummary();
        return;
      }
      // custom
      const from = document.getElementById("crCustomFrom").value;
      const to = document.getElementById("crCustomTo").value;
      if (!from || !to || from > to) return alert("Please choose a valid From and To date");
      const preview = transactionsInRange(from, to);
      if (!confirm(`This will save ${from} to ${to} as your custom range and permanently delete ${preview.length} record(s) in it now. This cannot be undone. Continue?`)) return;
      runCustomDeletion(from, to);
      overlay.remove();
      renderRetentionSummary();
      alert(`${preview.length} record(s) deleted.`);
    };
  }
  render();
}

async function openSwitchToWebAuthnModal() {
  const available = await webAuthnPlatformAvailable();
  if (!available) { alert("Your phone's screen lock isn't available in this browser context. This usually means the app isn't running over HTTPS, or no Face ID / Fingerprint / Screen Lock is set up on this device yet."); return; }
  if (!confirm("This will use your phone's Face ID / Fingerprint / Screen Lock to open the app instead of a PIN. Continue?")) return;
  try {
    await registerWebAuthn();
    const secret = randomBytesB64(32);
    localStorage.setItem(DEVICE_SECRET_KEY, secret);
    SESSION_PIN = secret;
    if (hasWebCrypto() && MASTER_KEY && typeof MASTER_KEY !== "string") {
      const mkRaw = await crypto.subtle.exportKey("raw", MASTER_KEY);
      localStorage.setItem(MK_WRAP_PRIMARY_KEY, JSON.stringify(await wrapMasterKeyWithSecret(secret, mkRaw)));
    }
    DATA.settings = { ...getSettings(), authMethod: "webauthn" };
    await saveData(DATA);
    localStorage.setItem(AUTH_METHOD_KEY, "webauthn");
    alert("Done — next time you open the app, it'll use your phone's screen lock.");
    renderSettings();
  } catch (e) {
    console.error("WebAuthn switch failed:", e.name, e.message);
    alert(`Couldn't set that up (${e.name || "error"}: ${e.message || "unknown"}). Your PIN is still active.`);
  }
}

// Guarded full-wipe flow, reachable from Settings while already unlocked. Unlike the
// lock-screen "Erase" (which only exists as a last-resort when you're locked out),
// this one requires re-proving who you are — typing "DELETE" alone isn't enough,
// since a wipe here also destroys your Recovery Key and security answers, not just
// the app's data.
function openDeleteProfileModal(authMethod) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3 style="color:var(--expense)">Delete Everything?</h3>
      <p class="muted" style="margin-top:0">
        This permanently erases every transaction, category, account, planning event,
        debt, your profile, and all security settings on this device. There is no way
        back afterward — not even your Recovery Key will help, since it's deleted too.
      </p>
      <button class="btn-ghost" id="deleteProfileBackupBtn" style="width:100%">Download a Backup First</button>
      <label style="margin-top:12px">Type DELETE to confirm</label>
      <input type="text" id="deleteProfileTyped" placeholder="DELETE" />
      ${authMethod === "pin" ? `
      <label>Current PIN</label>
      <input type="password" inputmode="numeric" maxlength="4" id="deleteProfilePin" placeholder="••••" />
      ` : `<p class="muted" style="margin-top:8px">You'll be asked to confirm with your phone's screen lock.</p>`}
      <p id="deleteProfileError" class="muted" style="color:var(--expense)"></p>
      <button class="btn-danger" id="deleteProfileConfirmBtn" style="width:100%;margin-top:8px">Permanently Delete Everything</button>
      <button class="btn-ghost" id="deleteProfileCancelBtn" style="width:100%;margin-top:8px">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("deleteProfileCancelBtn").onclick = () => overlay.remove();
  document.getElementById("deleteProfileBackupBtn").onclick = () => downloadBackupNow();
  document.getElementById("deleteProfileConfirmBtn").onclick = async () => {
    const errEl = document.getElementById("deleteProfileError");
    errEl.textContent = "";
    if (document.getElementById("deleteProfileTyped").value !== "DELETE") {
      errEl.textContent = 'Type DELETE (all caps) to confirm.';
      return;
    }
    try {
      if (authMethod === "pin") {
        const pin = document.getElementById("deleteProfilePin").value;
        if (hasWebCrypto() && localStorage.getItem(MK_WRAP_PRIMARY_KEY)) {
          await unwrapMasterKeyWithSecret(pin, MK_WRAP_PRIMARY_KEY); // throws if wrong
        } else {
          const enc = JSON.parse(localStorage.getItem(ENC_STORE_KEY));
          await decryptData(pin, enc); // legacy / no-webcrypto fallback path
        }
      } else {
        await verifyWebAuthn(); // throws if declined/failed
      }
    } catch (e) {
      errEl.textContent = authMethod === "pin" ? "Current PIN is incorrect." : "Screen lock confirmation failed — try again.";
      return;
    }
    eraseAllAppData();
  };
}
