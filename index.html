        <option value="all" ${planningFilter.status==="all"?"selected":""}>All</option>
        <option value="upcoming" ${planningFilter.status==="upcoming"?"selected":""}>Upcoming</option>
        <option value="ongoing" ${planningFilter.status==="ongoing"?"selected":""}>Ongoing</option>
        <option value="completed" ${planningFilter.status==="completed"?"selected":""}>Completed</option>
        <option value="overbudget" ${planningFilter.status==="overbudget"?"selected":""}>Over Budget</option>
      </select>
      <label>Domestic / International</label>
      <select id="filterRegion">
        <option value="all" ${planningFilter.region==="all"?"selected":""}>Any</option>
        <option value="domestic" ${planningFilter.region==="domestic"?"selected":""}>Domestic</option>
        <option value="international" ${planningFilter.region==="international"?"selected":""}>International</option>
      </select>
    </div>

    <h2 class="section">Your Events (${filtered.length})</h2>
    <div id="eventsList"></div>
  `;

  document.querySelectorAll(".template-card").forEach(btn => btn.onclick = () => openCreateEventModal(btn.dataset.template));
  document.getElementById("filterType").onchange = (e) => { planningFilter.type = e.target.value; renderPlanning(); };
  document.getElementById("filterStatus").onchange = (e) => { planningFilter.status = e.target.value; renderPlanning(); };
  document.getElementById("filterRegion").onchange = (e) => { planningFilter.region = e.target.value; renderPlanning(); };

  const listEl = document.getElementById("eventsList");
  if (!filtered.length) {
    listEl.innerHTML = `<p class="muted">No events match this filter — tap a template above to start planning.</p>`;
    return;
  }
  listEl.innerHTML = "";
  filtered.forEach(s => {
    const e = s.event;
    const t = EVENT_TEMPLATES[e.templateType] || EVENT_TEMPLATES.custom;
    const showBudget = eventBudgetEnabled(e);
    const pct = s.totalBudget > 0 ? (s.totalSpent / s.totalBudget) * 100 : 0;
    const div = document.createElement("div");
    div.className = "card event-card";
    div.innerHTML = `
      <div class="event-emoji" style="background:${t.color}">${e.icon || t.icon}</div>
      <div class="event-main">
        <div class="space-between">
          <strong>${escapeHtml(e.name)}</strong>
          <span style="background:${statusBadgeColor(s.status)};color:#fff;font-size:10px;padding:2px 8px;border-radius:99px">${s.status}</span>
        </div>
        ${showBudget ? `
          <div class="space-between" style="margin-top:2px"><span class="muted">₹${s.totalSpent.toFixed(0)} / ₹${s.totalBudget.toFixed(0)}</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.min(pct,100)}%;background:${budgetColor(pct)}"></div></div>
        ` : `<div class="space-between" style="margin-top:2px"><span class="muted">₹${s.totalSpent.toFixed(0)} spent</span></div>`}
      </div>`;
    div.onclick = () => { planningView = "detail"; planningDetailEventId = e.id; renderPlanning(); };
    listEl.appendChild(div);
  });
}

function openCreateEventModal(templateKey) {
  const t = EVENT_TEMPLATES[templateKey];
  const state = {
    templateType: templateKey, tripType: "domestic", destination: "", name: "",
    startDate: "", endDate: "", travelers: 1, notes: "", icon: t.icon,
    isInternational: false, currency: null, secondaryCurrency: null, carriers: [],
    items: t.defaultItems.map(label => ({ label, budget: 0 })),
    customFields: [],
  };
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  document.body.appendChild(overlay);

  function currentIntl() { return t.needsTripType ? state.tripType === "international" : state.isInternational; }
  function applyIntlItems() {
    const base = t.defaultItems.map(label => ({ label, budget: 0 }));
    const extra = (currentIntl() && t.intlExtraItems) ? t.intlExtraItems.map(label => ({ label, budget: 0 })) : [];
    // Preserve any budgets/custom items the user already typed, matched by label.
    const merged = [...base, ...extra].map(item => {
      const existing = state.items.find(i => i.label === item.label);
      return existing ? existing : item;
    });
    const customOnes = state.items.filter(i => !merged.some(m => m.label === i.label));
    state.items = [...merged, ...customOnes];
  }

  function renderItemsList() {
    const list = document.getElementById("itemsList");
    list.innerHTML = "";
    state.items.forEach((item, idx) => {
      const row = document.createElement("div");
      row.className = "row";
      row.style.marginBottom = "6px";
      row.innerHTML = `
        <input type="text" value="${escapeHtml(item.label)}" style="flex:2" data-idx="${idx}" class="itemLabelInput" />
        <input type="number" value="${item.budget || ""}" placeholder="₹" style="flex:1" data-idx="${idx}" class="itemBudgetInput" />
        <button class="btn-danger" data-idx="${idx}" style="flex:0 0 40px">✕</button>`;
      list.appendChild(row);
    });
    list.querySelectorAll(".itemLabelInput").forEach(inp => inp.onchange = (e) => { state.items[+e.target.dataset.idx].label = e.target.value; });
    list.querySelectorAll(".itemBudgetInput").forEach(inp => inp.onchange = (e) => { state.items[+e.target.dataset.idx].budget = parseFloat(e.target.value) || 0; });
    list.querySelectorAll("button[data-idx]").forEach(btn => btn.onclick = () => { state.items.splice(+btn.dataset.idx, 1); renderItemsList(); });
  }
  function renderCustomFieldsList() {
    const list = document.getElementById("customFieldsList");
    if (!list) return;
    list.innerHTML = "";
    state.customFields.forEach((f, idx) => {
      const row = document.createElement("div");
      row.className = "row";
      row.style.marginBottom = "6px";
      row.innerHTML = `
        <input type="text" value="${escapeHtml(f.name)}" placeholder="Field name" style="flex:1" data-idx="${idx}" class="cfName" />
        <input type="text" value="${escapeHtml(f.value)}" placeholder="Value" style="flex:1" data-idx="${idx}" class="cfValue" />
        <button class="btn-danger" data-idx="${idx}" style="flex:0 0 40px">✕</button>`;
      list.appendChild(row);
    });
    list.querySelectorAll(".cfName").forEach(inp => inp.onchange = (e) => { state.customFields[+e.target.dataset.idx].name = e.target.value; });
    list.querySelectorAll(".cfValue").forEach(inp => inp.onchange = (e) => { state.customFields[+e.target.dataset.idx].value = e.target.value; });
    list.querySelectorAll("button[data-idx]").forEach(btn => btn.onclick = () => { state.customFields.splice(+btn.dataset.idx, 1); renderCustomFieldsList(); });
  }

  function renderStep(step) {
    if (step === "tripType") {
      overlay.innerHTML = `
        <div class="modal-box">
          <h3>${t.icon} New ${t.label}</h3>
          <label style="margin-top:0">Is this trip domestic or international?</label>
          <div class="toggle-row">
            <button id="domBtn" class="active">Domestic</button>
            <button id="intlBtn">International</button>
          </div>
          <button class="btn-accent" id="nextBtn" style="width:100%">Next</button>
          <button class="btn-ghost" id="cancelBtn" style="width:100%;margin-top:8px">Cancel</button>
        </div>`;
      document.getElementById("domBtn").onclick = (e) => { state.tripType = "domestic"; e.target.classList.add("active"); document.getElementById("intlBtn").classList.remove("active"); };
      document.getElementById("intlBtn").onclick = (e) => { state.tripType = "international"; e.target.classList.add("active"); document.getElementById("domBtn").classList.remove("active"); };
      document.getElementById("nextBtn").onclick = () => renderStep("destination");
      document.getElementById("cancelBtn").onclick = () => overlay.remove();
      return;
    }
    if (step === "destination") {
      const intl = currentIntl();
      if (intl) {
        if (!state.destinations) state.destinations = [];
        overlay.innerHTML = `
          <div class="modal-box">
            <h3>${t.icon} Where to?</h3>
            ${t.offersIntlToggle ? `<label style="margin-top:0"><input type="checkbox" id="intlCheck" checked /> This is international</label>` : ""}
            <p class="muted" style="margin-top:0">Add every country you'll visit — currency is detected automatically, you just confirm the exchange rate.</p>
            <div id="destList"></div>
            <div class="row" style="margin-top:8px">
              <select id="addCountrySelect" style="flex:2">
                <option value="">Select a country to add...</option>
                ${COUNTRIES.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join("")}
              </select>
              <button class="btn-ghost btn-small" id="addCountryBtn" style="flex:0 0 60px">Add</button>
            </div>
            <button class="btn-accent" id="nextBtn" style="width:100%;margin-top:14px">Next</button>
            <button class="btn-ghost" id="backBtn" style="width:100%;margin-top:8px">${t.needsTripType ? "Back" : "Cancel"}</button>
          </div>`;
        function renderDestList() {
          const list = document.getElementById("destList");
          list.innerHTML = state.destinations.map((d, idx) => `
            <div class="card" style="padding:10px">
              <div class="space-between">
                <strong>${escapeHtml(d.country)}</strong>
                <button class="btn-danger" data-idx="${idx}" style="padding:2px 8px">✕</button>
              </div>
              <div class="muted">Currency: ${d.currencyCode} (${d.currencySymbol})</div>
              <label style="margin-top:6px">Exchange Rate (1 ${d.currencyCode} = ₹)</label>
              <input type="number" step="0.01" value="${d.rateToBase || ""}" data-idx="${idx}" class="destRateInput" />
            </div>`).join("");
          list.querySelectorAll("button[data-idx]").forEach(btn => btn.onclick = () => { state.destinations.splice(+btn.dataset.idx,1); renderDestList(); });
          list.querySelectorAll(".destRateInput").forEach(inp => inp.onchange = (e) => { state.destinations[+e.target.dataset.idx].rateToBase = parseFloat(e.target.value) || 0; });
        }
        renderDestList();
        if (t.offersIntlToggle) {
          document.getElementById("intlCheck").onchange = (e) => { state.isInternational = e.target.checked; renderStep("destination"); };
        }
        document.getElementById("addCountryBtn").onclick = () => {
          const name = document.getElementById("addCountrySelect").value;
          if (!name) return;
          if (state.destinations.some(d => d.country === name)) return alert("Already added");
          const info = COUNTRIES.find(c => c.name === name);
          state.destinations.push({ country: name, currencyCode: info.currencyCode, currencySymbol: info.currencySymbol, rateToBase: sampleRateFor(info.currencyCode) || 0 });
          renderDestList();
        };
        document.getElementById("nextBtn").onclick = () => {
          if (!state.destinations.length) return alert("Add at least one destination country");
          if (state.destinations.some(d => !d.rateToBase || d.rateToBase <= 0)) return alert("Enter a valid exchange rate for every destination");
          state.destination = state.destinations.map(d => d.country).join(", ");
          state.name = `${state.destinations[0].country}${state.destinations.length > 1 ? " +" + (state.destinations.length - 1) + " more" : ""} ${t.label}`;
          renderStep("carriers");
        };
        document.getElementById("backBtn").onclick = () => t.needsTripType ? renderStep("tripType") : overlay.remove();
        return;
      }
      // Domestic (or a template with no international option) — state dropdown when we
      // know the user's home country, otherwise a plain text field.
      const profile = getProfile();
      const states = statesFor(profile.country);
      overlay.innerHTML = `
        <div class="modal-box">
          <h3>${t.icon} Where to?</h3>
          ${t.offersIntlToggle ? `<label style="margin-top:0"><input type="checkbox" id="intlCheck" /> This is international</label>` : ""}
          <label style="margin-top:0">${states ? "State" : "Place"}</label>
          ${states
            ? `<select id="destInput"><option value="">Select a state...</option>${states.map(s => `<option value="${escapeHtml(s)}" ${state.destination===s?"selected":""}>${escapeHtml(s)}</option>`).join("")}</select>`
            : `<input type="text" id="destInput" placeholder="e.g. Goa, Manali" value="${escapeHtml(state.destination)}" />`}
          ${!states ? `<p class="muted">${profile.country ? "No state list available for " + escapeHtml(profile.country) + " yet — type it in." : "Tip: set your country in Settings to get a state dropdown here."}</p>` : ""}
          <button class="btn-accent" id="nextBtn" style="width:100%">Next</button>
          <button class="btn-ghost" id="backBtn" style="width:100%;margin-top:8px">${t.needsTripType ? "Back" : "Cancel"}</button>
        </div>`;
      if (t.offersIntlToggle) {
        document.getElementById("intlCheck").onchange = (e) => { state.isInternational = e.target.checked; renderStep("destination"); };
      }
      document.getElementById("nextBtn").onclick = () => {
        const dest = document.getElementById("destInput").value.trim();
        if (!dest) return alert(states ? "Please select a state" : "Please enter a place");
        state.destination = dest;
        state.name = `${dest} ${t.label}`;
        renderStep("carriers");
      };
      document.getElementById("backBtn").onclick = () => t.needsTripType ? renderStep("tripType") : overlay.remove();
      return;
    }
    if (step === "name") {
      overlay.innerHTML = `
        <div class="modal-box">
          <h3>${state.icon} New ${t.label}</h3>
          ${templateKey === "custom" ? `
          <label style="margin-top:0">Icon</label>
          <button type="button" class="btn-ghost" id="pickEventIconBtn" style="font-size:22px;padding:8px 16px">${state.icon}</button>
          <label>Name this event</label>
          ` : `<label style="margin-top:0">Name this event</label>`}
          <input type="text" id="nameInput" placeholder="e.g. Friday Team Lunch" value="${escapeHtml(state.name)}" />
          <button class="btn-accent" id="nextBtn" style="width:100%">Next</button>
          <button class="btn-ghost" id="cancelBtn" style="width:100%;margin-top:8px">Cancel</button>
        </div>`;
      if (templateKey === "custom") {
        document.getElementById("pickEventIconBtn").onclick = () => openIconPickerModal(state.icon, (icon) => {
          state.icon = icon;
          renderStep("name");
        });
      }
      document.getElementById("nextBtn").onclick = () => {
        state.name = document.getElementById("nameInput").value.trim() || t.label;
        renderStep(t.needsDates ? "dates" : "items");
      };
      document.getElementById("cancelBtn").onclick = () => overlay.remove();
      return;
    }
    if (step === "carriers") {
      const intl = currentIntl();
      if (intl) {
        overlay.innerHTML = `
          <div class="modal-box">
            <h3>💰 Currency You're Carrying</h3>
            <p class="muted" style="margin-top:0">Optional — track cash or a forex card you're bringing for this trip,
            so expenses in that currency can be deducted from it automatically.</p>
            <div id="carriersList"></div>
            <label style="margin-top:10px">Currency</label>
            <select id="carrierCcySelect">
              ${state.destinations.map(d => `<option value="${d.currencyCode}">${escapeHtml(d.country)} — ${d.currencyCode}</option>`).join("")}
            </select>
            <div class="row" style="margin-top:6px">
              <input type="text" id="carrierLabelInput" placeholder="e.g. Cash, Forex Card" style="flex:1" />
              <input type="number" id="carrierAmountInput" placeholder="Amount" style="flex:1" />
              <button class="btn-ghost btn-small" id="addCarrierBtn" style="flex:0 0 50px">Add</button>
            </div>
            <button class="btn-accent" id="nextBtn" style="width:100%;margin-top:14px">Next</button>
            <button class="btn-ghost" id="backBtn" style="width:100%;margin-top:8px">Back</button>
          </div>`;
        function renderCarriersList() {
          const list = document.getElementById("carriersList");
          if (!state.carriers.length) { list.innerHTML = `<p class="muted">None added yet — this trip works fine without it too.</p>`; return; }
          list.innerHTML = state.carriers.map((c, idx) => `
            <div class="card" style="padding:10px">
              <div class="space-between">
                <strong>${escapeHtml(c.label)} — ${c.currencyCode}</strong>
                <button class="btn-danger" data-idx="${idx}" style="padding:2px 8px">✕</button>
              </div>
              <div class="muted">Carrying: ${c.currencySymbol}${c.carriedAmount}</div>
            </div>`).join("");
          list.querySelectorAll("button[data-idx]").forEach(btn => btn.onclick = () => { state.carriers.splice(+btn.dataset.idx, 1); renderCarriersList(); });
        }
        renderCarriersList();
        document.getElementById("addCarrierBtn").onclick = () => {
          const code = document.getElementById("carrierCcySelect").value;
          const label = document.getElementById("carrierLabelInput").value.trim() || "Cash";
          const amount = parseFloat(document.getElementById("carrierAmountInput").value);
          if (!amount || amount <= 0) return alert("Enter a valid amount");
          const dest = state.destinations.find(d => d.currencyCode === code);
          // One consolidated carried-currency entry per destination/currency — if this
          // currency is already being carried, add to it instead of creating a duplicate.
          const existing = state.carriers.find(c => c.currencyCode === code);
          if (existing) {
            existing.carriedAmount += amount;
            if (!existing.label.includes(label)) existing.label = existing.label + " + " + label;
          } else {
            state.carriers.push({ id: nextId(DATA), label, currencyCode: code, currencySymbol: dest.currencySymbol, carriedAmount: amount });
          }
          document.getElementById("carrierLabelInput").value = "";
          document.getElementById("carrierAmountInput").value = "";
          renderCarriersList();
        };
        document.getElementById("nextBtn").onclick = () => renderStep(t.needsDates ? "dates" : "currency-secondary");
        document.getElementById("backBtn").onclick = () => renderStep("destination");
        return;
      }
      // Domestic — no foreign currency involved, so this is just a simple ₹ cash
      // tracker. No currency picker, no exchange rate, no secondary currency.
      overlay.innerHTML = `
        <div class="modal-box">
          <h3>💵 Cash You're Carrying</h3>
          <p class="muted" style="margin-top:0">Optional — track cash you're bringing for this trip (in ₹),
          so expenses can be deducted from it automatically.</p>
          <div id="carriersList"></div>
          <div class="row" style="margin-top:6px">
            <input type="text" id="carrierLabelInput" placeholder="e.g. Cash" style="flex:1" />
            <input type="number" id="carrierAmountInput" placeholder="₹ Amount" style="flex:1" />
            <button class="btn-ghost btn-small" id="addCarrierBtn" style="flex:0 0 50px">Add</button>
          </div>
          <button class="btn-accent" id="nextBtn" style="width:100%;margin-top:14px">Next</button>
          <button class="btn-ghost" id="backBtn" style="width:100%;margin-top:8px">Back</button>
        </div>`;
      function renderDomesticCarriersList() {
        const list = document.getElementById("carriersList");
        if (!state.carriers.length) { list.innerHTML = `<p class="muted">None added yet — this trip works fine without it too.</p>`; return; }
        list.innerHTML = state.carriers.map((c, idx) => `
          <div class="card" style="padding:10px">
            <div class="space-between">
              <strong>${escapeHtml(c.label)}</strong>
              <button class="btn-danger" data-idx="${idx}" style="padding:2px 8px">✕</button>
            </div>
            <div class="muted">Carrying: ₹${c.carriedAmount}</div>
          </div>`).join("");
        list.querySelectorAll("button[data-idx]").forEach(btn => btn.onclick = () => { state.carriers.splice(+btn.dataset.idx, 1); renderDomesticCarriersList(); });
      }
      renderDomesticCarriersList();
      document.getElementById("addCarrierBtn").onclick = () => {
        const label = document.getElementById("carrierLabelInput").value.trim() || "Cash";
        const amount = parseFloat(document.getElementById("carrierAmountInput").value);
        if (!amount || amount <= 0) return alert("Enter a valid amount");
        // One consolidated entry — adding more cash later tops up the same entry
        // rather than creating a duplicate. Domestic carriers are always ₹ (INR).
        const existing = state.carriers.find(c => c.currencyCode === "INR");
        if (existing) {
          existing.carriedAmount += amount;
          if (!existing.label.includes(label)) existing.label = existing.label + " + " + label;
        } else {
          state.carriers.push({ id: nextId(DATA), label, currencyCode: "INR", currencySymbol: "₹", carriedAmount: amount });
        }
        document.getElementById("carrierLabelInput").value = "";
        document.getElementById("carrierAmountInput").value = "";
        renderDomesticCarriersList();
      };
      document.getElementById("nextBtn").onclick = () => renderStep(t.needsDates ? "dates" : "items");
      document.getElementById("backBtn").onclick = () => renderStep("destination");
      return;
    }
    if (step === "dates") {
      overlay.innerHTML = `
        <div class="modal-box">
          <h3>${t.icon} When?</h3>
          <div class="date-range-row">
            <div><label style="margin-top:0">Start Date</label><input type="date" id="startDate" value="${state.startDate}" /></div>
            <div><label style="margin-top:0">End Date</label><input type="date" id="endDate" value="${state.endDate}" /></div>
          </div>
          <label>Number of Travelers/People</label>
          <input type="number" id="travelers" value="${state.travelers}" min="1" />
          <label>Notes (optional)</label>
          <input type="text" id="notesInput" value="${escapeHtml(state.notes)}" placeholder="Any extra detail..." />
          <button class="btn-accent" id="nextBtn" style="width:100%">Next</button>
          <button class="btn-ghost" id="backBtn" style="width:100%;margin-top:8px">Back</button>
        </div>`;
      document.getElementById("nextBtn").onclick = () => {
        state.startDate = document.getElementById("startDate").value;
        state.endDate = document.getElementById("endDate").value;
        state.travelers = parseInt(document.getElementById("travelers").value) || 1;
        state.notes = document.getElementById("notesInput").value;
        renderStep(currentIntl() ? "currency-secondary" : "items");
      };
      document.getElementById("backBtn").onclick = () => {
        if (t.needsDestination) renderStep("carriers");
        else if (t.needsTripType) renderStep("tripType");
        else renderStep("name");
      };
      return;
    }
    if (step === "currency-secondary") {
      overlay.innerHTML = `
        <div class="modal-box">
          <h3>💱 Secondary Currency (optional)</h3>
          <p class="muted" style="margin-top:0">Shown alongside ₹ and each destination's own currency on every expense, if you turn it on.
          Chosen from the full world currency list.</p>
          <label style="margin-top:0"><input type="checkbox" id="secToggle" ${state.secondaryCurrency ? "checked" : ""}/> + Add Secondary Currency</label>
          <div id="secondaryBlock" class="${state.secondaryCurrency ? "" : "hidden"}">
            <label>Secondary Currency</label>
            <select id="secondaryCcy">
              ${WORLD_CURRENCIES.map(c => `<option value="${c.code}" ${state.secondaryCurrency && state.secondaryCurrency.code === c.code ? "selected" : ""}>${c.code}${c.symbol !== c.code ? " (" + c.symbol + ")" : ""}</option>`).join("")}
            </select>
            <label>Exchange Rate (1 unit = ₹)</label>
            <input type="number" id="secondaryRate" step="0.01" value="${state.secondaryCurrency ? state.secondaryCurrency.rateToBase : ""}" />
          </div>
          <button class="btn-accent" id="nextBtn" style="width:100%;margin-top:14px">Next</button>
          <button class="btn-ghost" id="backBtn" style="width:100%;margin-top:8px">Back</button>
        </div>`;
      document.getElementById("secToggle").onchange = (e) => {
        document.getElementById("secondaryBlock").classList.toggle("hidden", !e.target.checked);
        if (e.target.checked && !document.getElementById("secondaryRate").value) {
          const c = WORLD_CURRENCIES.find(c => c.code === document.getElementById("secondaryCcy").value);
          document.getElementById("secondaryRate").value = sampleRateFor(c.code);
        }
      };
      document.getElementById("secondaryCcy").onchange = (e) => {
        document.getElementById("secondaryRate").value = sampleRateFor(e.target.value);
      };
      document.getElementById("nextBtn").onclick = () => {
        if (document.getElementById("secToggle").checked) {
          const sCode = document.getElementById("secondaryCcy").value;
          const sRate = parseFloat(document.getElementById("secondaryRate").value);
          if (!sRate || sRate <= 0) return alert("Enter a valid exchange rate");
          const sInfo = WORLD_CURRENCIES.find(c => c.code === sCode);
          state.secondaryCurrency = { code: sCode, symbol: sInfo.symbol, rateToBase: sRate };
        } else {
          state.secondaryCurrency = null;
        }
        applyIntlItems();
        renderStep("items");
      };
      document.getElementById("backBtn").onclick = () => renderStep(t.needsDates ? "dates" : "carriers");
      return;
    }
    if (step === "items") {
      applyIntlItems();
      overlay.innerHTML = `
        <div class="modal-box">
          <h3>${state.icon} ${escapeHtml(state.name || t.label)}</h3>
          <label style="margin-top:0">Budget for each item (₹${state.currency ? " base currency" : ""}, optional — editable later)</label>
          <div id="itemsList"></div>
          <div class="row" style="margin-top:8px">
            <input type="text" id="customItemInput" placeholder="Add your own item..." />
            <button class="btn-ghost btn-small" id="addItemBtn" style="flex:0 0 60px">Add</button>
          </div>
          <label style="margin-top:16px">Custom Fields (optional)</label>
          <div id="customFieldsList"></div>
          <div class="row" style="margin-top:4px">
            <button class="btn-ghost btn-small" id="addFieldBtn" style="width:100%">+ Add Custom Field</button>
          </div>
          <button class="btn-accent" id="createBtn" style="width:100%;margin-top:14px">Create ${t.label}</button>
          <button class="btn-ghost" id="cancelBtn" style="width:100%;margin-top:8px">Cancel</button>
        </div>`;
      renderItemsList();
      renderCustomFieldsList();
      document.getElementById("addItemBtn").onclick = () => {
        const val = document.getElementById("customItemInput").value.trim();
        if (!val) return;
        state.items.push({ label: val, budget: 0 });
        document.getElementById("customItemInput").value = "";
        renderItemsList();
      };
      document.getElementById("addFieldBtn").onclick = () => {
        state.customFields.push({ name: "", value: "" });
        renderCustomFieldsList();
      };
      document.getElementById("createBtn").onclick = () => {
        if (!state.items.length) return alert("Add at least one budget item");
        const intl = currentIntl();
        const event = addEvent({
          templateType: state.templateType,
          name: state.name || t.label,
          icon: state.icon !== t.icon ? state.icon : undefined,
          tripType: t.needsTripType ? state.tripType : (t.offersIntlToggle ? (state.isInternational ? "international" : "domestic") : undefined),
          destination: t.needsDestination ? state.destination : undefined,
          destinations: intl ? state.destinations : undefined,
          carriers: state.carriers && state.carriers.length ? state.carriers : undefined,
          budgetEnabled: false,
          startDate: state.startDate || undefined,
          endDate: state.endDate || undefined,
          travelers: t.needsDates ? state.travelers : undefined,
          notes: state.notes || undefined,
          secondaryCurrency: state.secondaryCurrency || undefined,
          items: state.items,
          customFields: state.customFields.filter(f => f.name.trim()),
        });
        overlay.remove();
        planningView = "detail"; planningDetailEventId = event.id;
        renderPlanning();
      };
      document.getElementById("cancelBtn").onclick = () => overlay.remove();
      return;
    }
  }

  renderStep(t.needsTripType ? "tripType" : (t.needsDestination ? "destination" : (t.needsDates ? "dates" : "name")));
}

function openAddEventExpenseModal(eventId, itemLabel) {
  const ev = getEventById(eventId);
  const cats = getCategories("expense");
  const accs = getAccounts();
  const destinations = ev.destinations || [];
  const hasCcy = destinations.length > 0;
  const domesticCarriers = !hasCcy ? carrierSummary(eventId) : []; // domestic events only ever carry ₹
  let entryMode = "base"; // "base" (default) or "destination"
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  function carriersFor(currencyCode) {
    return carrierSummary(eventId).filter(c => c.currencyCode === currencyCode);
  }

  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Add Expense — ${escapeHtml(itemLabel)}</h3>
      ${hasCcy ? `
        <div class="toggle-row" style="margin-top:0">
          <button id="modeBase" class="active">₹ Base Currency</button>

        </div>

            </select>` : `<input type="hidden" id="evDestSelect" value="0" />`}
          <label>Amount in <span id="evCcyLabel">${destinations[0].currencyCode} (${destinations[0].currencySymbol})</span></label>
          <input type="number" id="evForeignAmount" placeholder="0.00" />
          <label>Exchange Rate (1 unit = ₹)</label>
          <input type="number" id="evRate" step="0.01" value="${destinations[0].rateToBase}" />
          <p class="muted" id="evConverted" style="margin:6px 0">≈ ₹0</p>
          <label>Deduct from carried currency <span class="muted">(optional)</span></label>
          <select id="evCarrierSelect"><option value="">— None, paid another way —</option></select>
          <p class="muted" id="evCarrierRemaining" style="margin:4px 0"></p>
        </div>
      ` : `
        <label style="margin-top:0">Amount (₹)</label>
        <input type="number" id="evAmount" placeholder="0.00" />
        ${domesticCarriers.length ? `
          <label>Deduct from carried cash <span class="muted">(optional)</span></label>
          <select id="evDomesticCarrierSelect">
            <option value="">— None, paid another way —</option>
            ${domesticCarriers.map(c => `<option value="${c.id}">${escapeHtml(c.label)} (₹${c.remaining.toFixed(0)} left)</option>`).join("")}
          </select>
        ` : ""}
      `}
      <label>Category</label>
      <select id="evCategory">
        <option value="">Select a category...</option>
        ${cats.map(c => `<option value="${c.id}">${c.icon || "🏷️"} ${escapeHtml(c.name)}</option>`).join("")}
      </select>
      <label>Bank Account <span class="muted" id="evAccountOptionalTag"></span></label>
      <select id="evAccount">
        <option value="">${accs.length ? "Select an account..." : "Add an account first"}</option>
        ${accs.map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("")}
      </select>
      <label>Payment Method</label>
      <select id="evPayment">
        <option value="">Select...</option>
        ${PAYMENT_METHODS.map(m => `<option value="${m}">${m}</option>`).join("")}
      </select>
      <label>Date</label>
      <input type="date" id="evDate" value="${new Date().toISOString().slice(0,10)}" />
      <label>Note (optional)</label>
      <input type="text" id="evNote" />
      <label style="margin-top:16px"><input type="checkbox" id="evSplitToggle" /> Split this expense with others</label>
      <div id="evSplitBlock" class="hidden">
        <div class="toggle-row">
          <button id="evSplitEqual" class="active">Split Equally</button>
          <button id="evSplitCustom">Custom Amounts</button>
        </div>
        <div id="evSplitList"></div>
        <div class="row" style="margin-top:6px">
          <input type="text" id="evSplitNameInput" placeholder="Person's name" style="flex:1" />
          <button class="btn-ghost btn-small" id="evSplitAddBtn" style="flex:0 0 60px">Add</button>
        </div>
        <p class="muted" id="evSplitSummary" style="margin-top:8px"></p>
      </div>
      <button class="btn-accent" id="evSaveBtn" style="width:100%">Save Expense</button>
      <button class="btn-ghost" id="evCancelBtn" style="width:100%;margin-top:8px">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  let evSplitParticipants = [];
  let evSplitMethod = "equal";

  function refreshCarrierOptions() {
    if (!hasCcy) return;
    const destIdx = parseInt(document.getElementById("evDestSelect").value) || 0;
    const dest = destinations[destIdx];
    const sel = document.getElementById("evCarrierSelect");
    const matches = carriersFor(dest.currencyCode);
    sel.innerHTML = `<option value="">— None, paid another way —</option>` +
      matches.map(c => `<option value="${c.id}">${escapeHtml(c.label)} (${c.currencySymbol}${c.remaining.toFixed(0)} left)</option>`).join("");
    updateCarrierRemainingText();
  }
  function updateCarrierRemainingText() {
    const carrierId = parseInt(document.getElementById("evCarrierSelect").value);
    const el = document.getElementById("evCarrierRemaining");
    if (!carrierId) { el.textContent = ""; return; }
    const destIdx = parseInt(document.getElementById("evDestSelect").value) || 0;
    const dest = destinations[destIdx];
    const c = carriersFor(dest.currencyCode).find(c => c.id === carrierId);
    const amt = parseFloat(document.getElementById("evForeignAmount").value) || 0;
    if (c) el.textContent = `${c.currencySymbol}${c.remaining.toFixed(0)} carried, ${c.currencySymbol}${(c.remaining - amt).toFixed(0)} left after this`;
  }
  function updateAccountOptionalTag() {
    const domesticSelect = document.getElementById("evDomesticCarrierSelect");
    const domesticCarrierChosen = domesticSelect && domesticSelect.value;
    const optional = (hasCcy && entryMode === "destination") || domesticCarrierChosen;
    document.getElementById("evAccountOptionalTag").textContent = optional ? "(optional when paying from carried cash)" : "";
  }
  const domesticCarrierSelectEl = document.getElementById("evDomesticCarrierSelect");
  if (domesticCarrierSelectEl) domesticCarrierSelectEl.addEventListener("change", updateAccountOptionalTag);
  updateAccountOptionalTag();

  if (hasCcy) {
    refreshCarrierOptions();
    updateAccountOptionalTag();
    document.getElementById("modeBase").onclick = (e) => {
      entryMode = "base";
      e.target.classList.add("active"); document.getElementById("modeDest").classList.remove("active");
      document.getElementById("baseBlock").classList.remove("hidden");
      document.getElementById("destBlock").classList.add("hidden");
      updateAccountOptionalTag();
    };
    document.getElementById("modeDest").onclick = (e) => {
      entryMode = "destination";
      e.target.classList.add("active"); document.getElementById("modeBase").classList.remove("active");
      document.getElementById("destBlock").classList.remove("hidden");
      document.getElementById("baseBlock").classList.add("hidden");
      updateAccountOptionalTag();
    };
    const updateConverted = () => {
      const amt = parseFloat(document.getElementById("evForeignAmount").value) || 0;
      const rate = parseFloat(document.getElementById("evRate").value) || 0;
      let text = `≈ ₹${(amt * rate).toFixed(2)}`;
      if (ev.secondaryCurrency) {
        const baseAmt = amt * rate;
        const secAmt = baseAmt / ev.secondaryCurrency.rateToBase;
        text += ` · ≈ ${ev.secondaryCurrency.symbol}${secAmt.toFixed(2)}`;
      }
      document.getElementById("evConverted").textContent = text;
      updateCarrierRemainingText();
    };
    document.getElementById("evForeignAmount").oninput = updateConverted;
    document.getElementById("evRate").oninput = updateConverted;
    document.getElementById("evCarrierSelect").onchange = updateCarrierRemainingText;
    if (destinations.length > 1) {
      document.getElementById("evDestSelect").onchange = (e) => {
        const d = destinations[+e.target.value];
        document.getElementById("evCcyLabel").textContent = `${d.currencyCode} (${d.currencySymbol})`;
        document.getElementById("evRate").value = d.rateToBase;
        refreshCarrierOptions();
        updateConverted();
      };
    }
  }

  document.getElementById("evCancelBtn").onclick = () => overlay.remove();

  function getCurrentEvAmount() {
    if (hasCcy && entryMode === "destination") {
      const amt = parseFloat(document.getElementById("evForeignAmount").value) || 0;
      const rate = parseFloat(document.getElementById("evRate").value) || 0;
      return amt * rate;
    }
    return parseFloat(document.getElementById("evAmount").value) || 0;
  }
  function getCurrentEvForeignInfo() {
    if (hasCcy && entryMode === "destination") {
      const destIdx = parseInt(document.getElementById("evDestSelect").value) || 0;
      const dest = destinations[destIdx];
      const amt = parseFloat(document.getElementById("evForeignAmount").value) || 0;
      const rate = parseFloat(document.getElementById("evRate").value) || 0;
      return { amount: amt, rate, code: dest.currencyCode, symbol: dest.currencySymbol };
    }
    return null;
  }
  function formatShareText(baseAmt, fx) {
    if (fx && fx.rate > 0) return `${fx.symbol}${(baseAmt / fx.rate).toFixed(2)} ≈ ₹${baseAmt.toFixed(2)}`;
    return `₹${baseAmt.toFixed(2)}`;
  }
  function renderEvSplitList() {
    const list = document.getElementById("evSplitList");
    const fx = getCurrentEvForeignInfo();
    if (evSplitMethod === "equal") {
      list.innerHTML = `<div class="space-between" style="padding:4px 0"><span>You</span><strong id="evSplitYouShare">₹0.00</strong></div>` +
        evSplitParticipants.map((p, idx) => `
          <div class="space-between" style="padding:4px 0">
            <span>${escapeHtml(p.name)}</span>
            <span><strong class="evSplitEachShare">₹0.00</strong> <button class="btn-danger" data-idx="${idx}" style="padding:2px 6px;margin-left:6px">✕</button></span>
          </div>`).join("");
    } else {
      list.innerHTML = `<div class="space-between" style="padding:4px 0"><span>You</span><strong id="evSplitYouShare">₹0.00</strong></div>` +
        evSplitParticipants.map((p, idx) => `
          <div class="row" style="align-items:center;margin-bottom:4px">
            <span style="flex:1">${escapeHtml(p.name)}</span>
            <input type="number" value="${fx ? (p.shareForeign ?? "") : (p.share || "")}" data-idx="${idx}" class="evSplitShareInput" style="flex:1" placeholder="${fx ? fx.symbol : "₹"}" />
            <button class="btn-danger" data-idx="${idx}" style="flex:0 0 34px">✕</button>
          </div>`).join("");
      // Update state on every keystroke WITHOUT rebuilding the input elements —
      // rebuilding mid-type is what was destroying focus and closing the keypad.
      // When entering in destination currency, the input IS the foreign amount;
      // the base-currency (₹) share is derived from it via the trip's rate.
      list.querySelectorAll(".evSplitShareInput").forEach(inp => inp.oninput = (e) => {
        const idx = +e.target.dataset.idx;
        const val = parseFloat(e.target.value) || 0;
        const fxNow = getCurrentEvForeignInfo();
        if (fxNow) {
          evSplitParticipants[idx].shareForeign = val;
          evSplitParticipants[idx].share = val * fxNow.rate;
        } else {
          evSplitParticipants[idx].share = val;
          delete evSplitParticipants[idx].shareForeign;
        }
        updateEvSplitDisplay();
      });
    }
    list.querySelectorAll("button[data-idx]").forEach(btn => btn.onclick = () => {
      evSplitParticipants.splice(+btn.dataset.idx, 1);
      renderEvSplitList();
    });
    updateEvSplitDisplay();
  }
  function updateEvSplitDisplay() {
    const amount = getCurrentEvAmount();
    const fx = getCurrentEvForeignInfo();
    if (evSplitMethod === "equal") {
      const n = evSplitParticipants.length + 1;
      const each = n > 0 ? amount / n : 0;
      const text = formatShareText(each, fx);
      const youEl = document.getElementById("evSplitYouShare");
      if (youEl) youEl.textContent = text;
      document.querySelectorAll(".evSplitEachShare").forEach(el => el.textContent = text);
      document.getElementById("evSplitSummary").textContent = fx
        ? `Split ${fx.symbol}${(fx.amount || 0).toFixed(2)} (≈ ₹${amount.toFixed(2)}) equally among ${n} ${n === 1 ? "person" : "people"}`
        : `Split ₹${amount.toFixed(2)} equally among ${n} ${n === 1 ? "person" : "people"}`;
    } else {
      const othersTotalBase = evSplitParticipants.reduce((s,p) => s + (p.share || 0), 0);
      const yourShare = Math.max(amount - othersTotalBase, 0);
      const youEl = document.getElementById("evSplitYouShare");
      if (youEl) youEl.textContent = formatShareText(yourShare, fx);
      document.getElementById("evSplitSummary").textContent = othersTotalBase > amount
        ? `⚠️ Shares add up to more than the total amount`
        : `Your share: ${formatShareText(yourShare, fx)}`;
    }
  }
  document.getElementById("evSplitToggle").onchange = (e) => {
    document.getElementById("evSplitBlock").classList.toggle("hidden", !e.target.checked);
    if (e.target.checked) renderEvSplitList();
  };
  document.getElementById("evSplitEqual").onclick = (e) => { evSplitMethod = "equal"; e.target.classList.add("active"); document.getElementById("evSplitCustom").classList.remove("active"); renderEvSplitList(); };
  document.getElementById("evSplitCustom").onclick = (e) => { evSplitMethod = "custom"; e.target.classList.add("active"); document.getElementById("evSplitEqual").classList.remove("active"); renderEvSplitList(); };
  document.getElementById("evSplitAddBtn").onclick = () => {
    const name = document.getElementById("evSplitNameInput").value.trim();
    if (!name) return;
    evSplitParticipants.push({ name, share: 0 });
    document.getElementById("evSplitNameInput").value = "";
    renderEvSplitList();
  };
  ["evAmount", "evForeignAmount", "evRate"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", () => { if (document.getElementById("evSplitToggle").checked) updateEvSplitDisplay(); });
  });

  document.getElementById("evSaveBtn").onclick = () => {
    const categoryId = parseInt(document.getElementById("evCategory").value);
    const accountId = parseInt(document.getElementById("evAccount").value) || null;
    const paymentMethod = document.getElementById("evPayment").value;
    const date = document.getElementById("evDate").value;
    const note = document.getElementById("evNote").value;
    let amount, extra = {};
    if (hasCcy && entryMode === "destination") {
      const destIdx = parseInt(document.getElementById("evDestSelect").value) || 0;
      const dest = destinations[destIdx];
      const foreignAmount = parseFloat(document.getElementById("evForeignAmount").value);
      const rate = parseFloat(document.getElementById("evRate").value);
      if (!foreignAmount || foreignAmount <= 0) return alert("Enter a valid amount");
      if (!rate || rate <= 0) return alert("Enter a valid exchange rate");
      amount = foreignAmount * rate; // base currency (₹) amount — feeds all normal calculations
      extra = { originalAmount: foreignAmount, originalCurrency: dest.currencyCode, exchangeRate: rate, destinationCountry: dest.country };
      const carrierId = parseInt(document.getElementById("evCarrierSelect").value);
      if (carrierId) extra.carrierId = carrierId;
    } else {
      amount = parseFloat(document.getElementById("evAmount").value);
      if (!amount || amount <= 0) return alert("Enter a valid amount");
      const domesticSelect = document.getElementById("evDomesticCarrierSelect");
      const carrierId = domesticSelect ? parseInt(domesticSelect.value) : NaN;
      if (carrierId) extra = { originalAmount: amount, carrierId };
    }
    const payingFromCarrier = (hasCcy && entryMode === "destination") || !!extra.carrierId;
    if (!categoryId) return alert("Please select a category");
    if (!payingFromCarrier && !accountId) return alert("Please select a bank account");
    if (!paymentMethod) return alert("Please select a payment method");

    let split;
    const evSplitToggle = document.getElementById("evSplitToggle");
    if (evSplitToggle && evSplitToggle.checked) {
      if (!evSplitParticipants.length) return alert("Add at least one other person to split with, or turn splitting off");
      const fx = getCurrentEvForeignInfo();
      const fxFields = fx ? { foreignCurrency: fx.code, foreignSymbol: fx.symbol } : {};
      if (evSplitMethod === "equal") {
        const n = evSplitParticipants.length + 1;
        const each = amount / n;
        const eachForeign = fx && fx.rate > 0 ? each / fx.rate : undefined;
        const participant = (name, settled) => ({ name, share: each, settled, ...(eachForeign !== undefined ? { shareForeign: eachForeign } : {}), ...fxFields });
        split = { method: "equal", participants: [participant("You", true),
          ...evSplitParticipants.map(p => participant(p.name, false))] };
      } else {
        const othersTotal = evSplitParticipants.reduce((s,p) => s + (p.share || 0), 0);
        if (othersTotal > amount) return alert("Split shares add up to more than the total amount");
        const yourShare = amount - othersTotal;
        const yourShareForeign = fx && fx.rate > 0 ? yourShare / fx.rate : undefined;
        split = { method: "custom", participants: [
          { name: "You", share: yourShare, settled: true, ...(yourShareForeign !== undefined ? { shareForeign: yourShareForeign } : {}), ...fxFields },
          ...evSplitParticipants.map(p => ({ name: p.name, share: p.share || 0, settled: false, ...(fx && p.shareForeign !== undefined ? { shareForeign: p.shareForeign } : {}), ...fxFields })),
        ]};
      }
    }

    addTransaction({ type: "expense", amount, categoryId, accountId: accountId || undefined, paymentMethod, note, date, eventId, eventItem: itemLabel, split, ...extra });
    overlay.remove();
    renderPlanning();
  };
}

        <div class="card">
          <div class="space-between">
            <div><strong>Maintain a Budget for This Trip</strong>
              <div class="muted">Off by default — turn on if you want to set spending limits.</div>
            </div>
            <button id="budgetToggleBtn" class="${state.budgetEnabled ? "btn-primary" : "btn-ghost"}" style="flex:0 0 60px">${state.budgetEnabled ? "ON" : "OFF"}</button>
          </div>
        </div>
        <div id="budgetItemsBlock" class="${state.budgetEnabled ? "" : "hidden"}">
          <label>Item Budgets (₹)</label>
          <div id="editItemsList"></div>
        </div>

        ${showCurrencySections ? `
        <h2 class="section" style="font-size:15px">Destinations & Exchange Rates</h2>
        <div id="editDestList"></div>
        <div class="row" style="margin-top:8px">
          <select id="addCountrySelect" style="flex:2">
            <option value="">Add a destination country...</option>
            ${COUNTRIES.map(c => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join("")}
          </select>
          <button class="btn-ghost btn-small" id="addCountryBtn" style="flex:0 0 60px">Add</button>
        </div>
        ` : ""}

        ${showDomesticDestinations ? `
        <h2 class="section" style="font-size:15px">Destinations</h2>
        <div id="editDomesticDestList"></div>
        <div class="row" style="margin-top:8px">
          ${domesticStates
            ? `<select id="addDomesticDestSelect" style="flex:2">
                <option value="">Add a place...</option>
                ${domesticStates.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join("")}
              </select>`
            : `<input type="text" id="addDomesticDestInput" placeholder="e.g. Goa, Manali" style="flex:2" />`}
          <button class="btn-ghost btn-small" id="addDomesticDestBtn" style="flex:0 0 60px">Add</button>
        </div>
        ` : ""}

        ${showCarrierSection ? `
        <h2 class="section" style="font-size:15px">Carried Currency</h2>
        <p class="muted" style="margin-top:0">${state.destinations.length
          ? "Cash / forex card you're bringing. Adding more of a currency you already carry tops up that same entry — it never creates a duplicate."
          : "Cash you're bringing, in ₹. Since this is a domestic trip, no foreign currency is involved."}</p>
        <div id="editCarriersList"></div>
        ${state.destinations.length ? `
          <select id="carrierCcySelect">
            ${state.destinations.map(d => `<option value="${d.currencyCode}">${escapeHtml(d.country)} — ${d.currencyCode}</option>`).join("")}
          </select>
          <div class="row" style="margin-top:6px">
            <input type="text" id="carrierLabelInput" placeholder="e.g. Cash, Forex Card" style="flex:1" />
            <input type="number" id="carrierAmountInput" placeholder="Amount" style="flex:1" />
            <button class="btn-ghost btn-small" id="addCarrierBtn" style="flex:0 0 50px">Add</button>
          </div>` : `
          <div class="row" style="margin-top:6px">
            <input type="text" id="carrierLabelInput" placeholder="e.g. Cash" style="flex:1" />
            <input type="number" id="carrierAmountInput" placeholder="₹ Amount" style="flex:1" />
            <button class="btn-ghost btn-small" id="addDomesticCarrierBtn" style="flex:0 0 50px">Add</button>
          </div>`}
        ` : ""}

        ${showCurrencySections ? `
        <h2 class="section" style="font-size:15px">Secondary Currency</h2>
        <label style="margin-top:0"><input type="checkbox" id="secToggle" ${state.secondaryCurrency ? "checked" : ""}/> Show a secondary currency alongside ₹</label>
        <div id="secondaryBlock" class="${state.secondaryCurrency ? "" : "hidden"}">
          <label>Secondary Currency</label>
          <select id="secondaryCcy">
            ${WORLD_CURRENCIES.map(c => `<option value="${c.code}" ${state.secondaryCurrency && state.secondaryCurrency.code === c.code ? "selected" : ""}>${c.code}${c.symbol !== c.code ? " (" + c.symbol + ")" : ""}</option>`).join("")}
          </select>
          <label>Exchange Rate (1 unit = ₹)</label>
          <input type="number" id="secondaryRate" step="0.01" value="${state.secondaryCurrency ? state.secondaryCurrency.rateToBase : ""}" />
        </div>
        ` : ""}

        <button class="btn-accent" id="saveTripBtn" style="width:100%;margin-top:16px">Save Changes</button>
        <button class="btn-ghost" id="cancelTripBtn" style="width:100%;margin-top:8px">Cancel</button>
      </div>`;

    // --- Budget items ---
    const itemsList = document.getElementById("editItemsList");
    itemsList.innerHTML = state.items.map((item, idx) => `
      <div class="row" style="margin-bottom:6px">
        <span style="flex:1;align-self:center">${escapeHtml(item.label)}</span>
        <input type="number" value="${item.budget || ""}" placeholder="₹ budget" data-idx="${idx}" class="itemBudgetEdit" style="flex:1" />
      </div>`).join("");
    itemsList.querySelectorAll(".itemBudgetEdit").forEach(inp => inp.onchange = (e) => {
      state.items[+e.target.dataset.idx].budget = parseFloat(e.target.value) || 0;
    });
    document.getElementById("budgetToggleBtn").onclick = () => { state.budgetEnabled = !state.budgetEnabled; render(); };

    if (showCurrencySections) {
      // --- Destinations ---
      const destList = document.getElementById("editDestList");
      if (!state.destinations.length) {
        destList.innerHTML = `<p class="muted">No destinations yet — add one below.</p>`;
      } else {
        destList.innerHTML = state.destinations.map((d, idx) => `
          <div class="card" style="padding:10px">
            <div class="space-between">
              <strong>${escapeHtml(d.country)}</strong>
              <button class="btn-danger" data-idx="${idx}" style="padding:2px 8px">✕</button>
            </div>
            <div class="muted">Currency: ${d.currencyCode} (${d.currencySymbol})</div>
            <label style="margin-top:6px">Exchange Rate (1 ${d.currencyCode} = ₹)</label>
            <input type="number" step="0.01" value="${d.rateToBase || ""}" data-idx="${idx}" class="destRateInput" />
          </div>`).join("");
        destList.querySelectorAll("button[data-idx]").forEach(btn => btn.onclick = () => { state.destinations.splice(+btn.dataset.idx, 1); render(); });
        destList.querySelectorAll(".destRateInput").forEach(inp => inp.onchange = (e) => { state.destinations[+e.target.dataset.idx].rateToBase = parseFloat(e.target.value) || 0; });
      }
      document.getElementById("addCountryBtn").onclick = () => {
        const name = document.getElementById("addCountrySelect").value;
        if (!name) return;
        if (state.destinations.some(d => d.country === name)) return alert("Already added");
        const info = COUNTRIES.find(c => c.name === name);
        state.destinations.push({ country: name, currencyCode: info.currencyCode, currencySymbol: info.currencySymbol, rateToBase: sampleRateFor(info.currencyCode) || 0 });
        render();
      };
    }

    if (showDomesticDestinations) {
      // --- Domestic destinations — plain place names, no currency involved ---
      const domDestList = document.getElementById("editDomesticDestList");
      if (!state.domesticDestinations.length) {
        domDestList.innerHTML = `<p class="muted">No destinations yet — add one below.</p>`;
      } else {
        domDestList.innerHTML = state.domesticDestinations.map((d, idx) => `
          <div class="card" style="padding:10px">
            <div class="space-between">
              <strong>${escapeHtml(d)}</strong>
              <button class="btn-danger" data-idx="${idx}" style="padding:2px 8px">✕</button>
            </div>
          </div>`).join("");
        domDestList.querySelectorAll("button[data-idx]").forEach(btn => btn.onclick = () => {
          state.domesticDestinations.splice(+btn.dataset.idx, 1);
          render();
        });
      }
      document.getElementById("addDomesticDestBtn").onclick = () => {
        const input = document.getElementById("addDomesticDestSelect") || document.getElementById("addDomesticDestInput");
        const name = input.value.trim();
        if (!name) return;
        if (state.domesticDestinations.includes(name)) return alert("Already added");
        state.domesticDestinations.push(name);
        render();
      };
    }

    if (showCarrierSection) {
      // --- Carried currency (or, for domestic trips, just carried cash in ₹) ---
      // One consolidated entry per destination/currency — never a duplicate.
      const carriersList = document.getElementById("editCarriersList");
      if (!state.carriers.length) {
        carriersList.innerHTML = `<p class="muted">None added yet.</p>`;
      } else {
        carriersList.innerHTML = state.carriers.map((c, idx) => {
          const spent = carrierSpent(eventId, c.id);
          return `<div class="card" style="padding:10px">
            <div class="space-between">
              <strong>${escapeHtml(c.label)}${c.currencyCode !== "INR" ? " — " + c.currencyCode : ""}</strong>
              <button class="btn-danger" data-idx="${idx}" style="padding:2px 8px">✕</button>
            </div>
            <label style="margin-top:6px">Total Carried (${c.currencySymbol})</label>
            <input type="number" value="${c.carriedAmount}" data-idx="${idx}" class="carrierAmountEdit" />
            <div class="muted" style="margin-top:4px">${c.currencySymbol}${spent.toFixed(0)} already spent from this</div>
          </div>`;
        }).join("");
        carriersList.querySelectorAll("button[data-idx]").forEach(btn => btn.onclick = () => {
          const c = state.carriers[+btn.dataset.idx];
          const spent = carrierSpent(eventId, c.id);
          if (spent > 0 && !confirm(`${c.currencySymbol}${spent.toFixed(0)} of expenses are already linked to this carrier. Remove it anyway? (those expenses stay, just unlinked)`)) return;
          state.carriers.splice(+btn.dataset.idx, 1);
          render();
        });
        carriersList.querySelectorAll(".carrierAmountEdit").forEach(inp => inp.onchange = (e) => {
          const val = parseFloat(e.target.value);
          if (val >= 0) state.carriers[+e.target.dataset.idx].carriedAmount = val;
        });
      }
      const addCarrierBtn = document.getElementById("addCarrierBtn");
      if (addCarrierBtn) {
        addCarrierBtn.onclick = () => {
          const code = document.getElementById("carrierCcySelect").value;
          const label = document.getElementById("carrierLabelInput").value.trim() || "Cash";
          const amount = parseFloat(document.getElementById("carrierAmountInput").value);
          if (!amount || amount <= 0) return alert("Enter a valid amount");
          const dest = state.destinations.find(d => d.currencyCode === code);
          const existing = state.carriers.find(c => c.currencyCode === code);
          if (existing) {
            existing.carriedAmount += amount;
            if (!existing.label.includes(label)) existing.label = existing.label + " + " + label;
          } else {
            state.carriers.push({ id: nextId(DATA), label, currencyCode: code, currencySymbol: dest.currencySymbol, carriedAmount: amount });
          }
          document.getElementById("carrierLabelInput").value = "";
          document.getElementById("carrierAmountInput").value = "";
          render();
        };
      }
      const addDomesticCarrierBtn = document.getElementById("addDomesticCarrierBtn");
      if (addDomesticCarrierBtn) {
        addDomesticCarrierBtn.onclick = () => {
          const label = document.getElementById("carrierLabelInput").value.trim() || "Cash";
          const amount = parseFloat(document.getElementById("carrierAmountInput").value);
          if (!amount || amount <= 0) return alert("Enter a valid amount");
          const existing = state.carriers.find(c => c.currencyCode === "INR");
          if (existing) {
            existing.carriedAmount += amount;
            if (!existing.label.includes(label)) existing.label = existing.label + " + " + label;
          } else {
            state.carriers.push({ id: nextId(DATA), label, currencyCode: "INR", currencySymbol: "₹", carriedAmount: amount });
          }
          document.getElementById("carrierLabelInput").value = "";
          document.getElementById("carrierAmountInput").value = "";
          render();
        };
      }
    }

    if (showCurrencySections) {
      // --- Secondary currency ---
      document.getElementById("secToggle").onchange = (e) => {
        document.getElementById("secondaryBlock").classList.toggle("hidden", !e.target.checked);
      };
    }

    const editIconBtn = document.getElementById("editEventIconBtn");
    if (editIconBtn) editIconBtn.onclick = () => openIconPickerModal(state.icon, (icon) => { state.icon = icon; render(); });

    document.getElementById("cancelTripBtn").onclick = () => overlay.remove();
    document.getElementById("saveTripBtn").onclick = () => {
      const name = document.getElementById("editName").value.trim();
      if (!name) return alert("Please enter a name");
      const startDate = document.getElementById("editStartDate").value;
      const endDate = document.getElementById("editEndDate").value;
      const travelers = parseInt(document.getElementById("editTravelers").value) || undefined;

      const patch = {
        name, startDate: startDate || undefined, endDate: endDate || undefined, travelers,
        budgetEnabled: state.budgetEnabled, items: state.items,
      };
      if (ev.templateType === "custom") patch.icon = state.icon;
      if (showCarrierSection) patch.carriers = state.carriers;

      if (showDomesticDestinations) {
        patch.domesticDestinations = state.domesticDestinations;
        patch.destination = state.domesticDestinations.join(", ");
      }

      if (showCurrencySections) {
        if (state.destinations.some(d => !d.rateToBase || d.rateToBase <= 0)) return alert("Enter a valid exchange rate for every destination");
        let secondaryCurrency = null;
        if (document.getElementById("secToggle").checked) {
          const sCode = document.getElementById("secondaryCcy").value;
          const sRate = parseFloat(document.getElementById("secondaryRate").value);
          if (!sRate || sRate <= 0) return alert("Enter a valid secondary exchange rate");
          const sInfo = WORLD_CURRENCIES.find(c => c.code === sCode);
          secondaryCurrency = { code: sCode, symbol: sInfo.symbol, rateToBase: sRate };
        }
        patch.destinations = state.destinations;
        patch.secondaryCurrency = secondaryCurrency || undefined;
        patch.carriers = state.carriers;
        patch.tripType = state.destinations.length ? "international" : ev.tripType;
      }

      updateEvent(eventId, patch);
      overlay.remove();
      renderPlanning();
    };
  }
  render();
}

function renderPlanningDetail(eventId) {
  const main = document.getElementById("main");
  const s = eventSummary(eventId);
  if (!s) { planningView = "list"; renderPlanning(); return; }
  const e = s.event;
  const t = EVENT_TEMPLATES[e.templateType] || EVENT_TEMPLATES.custom;
  const pct = s.totalBudget > 0 ? (s.totalSpent / s.totalBudget) * 100 : 0;
  const carriers = carrierSummary(eventId);

  const metaLine = [
    e.destination ? (e.tripType ? (e.tripType === "domestic" ? "Domestic · " : "International · ") : "") + escapeHtml(e.destination) : "",
    e.startDate ? e.startDate + (e.endDate && e.endDate !== e.startDate ? " – " + e.endDate : "") : "",
    e.travelers ? `${e.travelers} traveler${e.travelers > 1 ? "s" : ""}` : "",
  ].filter(Boolean).join(" · ");

  let currencyBlock = "";
  let tripKpiBlock = "";
  const hasIntlDestinations = e.destinations && e.destinations.length;

  if (hasIntlDestinations) {
    currencyBlock = `
      <div class="card">
        <div class="space-between"><strong>Currency Summary</strong></div>
        <div class="muted" style="margin-top:4px">Base: INR ₹${e.secondaryCurrency ? " · Secondary: " + e.secondaryCurrency.code : ""}</div>
        ${e.destinations.map(d => `
          <div class="space-between" style="margin-top:8px">
            <span class="muted">${escapeHtml(d.country)}</span>
            <span>${d.currencySymbol} — 1 ${d.currencyCode} ≈ ₹${d.rateToBase}${e.secondaryCurrency ? " ≈ " + e.secondaryCurrency.symbol + (d.rateToBase / e.secondaryCurrency.rateToBase).toFixed(2) : ""}</span>
          </div>`).join("")}
      </div>`;

    // Trip-wide KPIs: carried/spent/remaining converted to base currency, plus destination count.
    const totalCarriedBase = carriers.reduce((sum, c) => {
      const d = e.destinations.find(d => d.currencyCode === c.currencyCode);
      return sum + (d ? c.carriedAmount * d.rateToBase : 0);
    }, 0);
    const totalCarrierSpentBase = carriers.reduce((sum, c) => {
      const d = e.destinations.find(d => d.currencyCode === c.currencyCode);
      return sum + (d ? c.spent * d.rateToBase : 0);
    }, 0);
    tripKpiBlock = `
      <div class="kpi-grid">
        <div class="kpi-tile" style="background:linear-gradient(135deg,#0891B2,#0E7490)">
          <span class="kpi-icon">💵</span><div class="kpi-label">Total Carried</div><div class="kpi-value">₹${totalCarriedBase.toFixed(0)}</div>
        </div>
        <div class="kpi-tile" style="background:linear-gradient(135deg,#EA580C,#C2410C)">
          <span class="kpi-icon">💸</span><div class="kpi-label">Spent from Carried</div><div class="kpi-value">₹${totalCarrierSpentBase.toFixed(0)}</div>
        </div>
        <div class="kpi-tile" style="background:linear-gradient(135deg,#16A34A,#15803D)">
          <span class="kpi-icon">🧳</span><div class="kpi-label">Remaining Carried</div><div class="kpi-value">₹${(totalCarriedBase - totalCarrierSpentBase).toFixed(0)}</div>
        </div>
        <div class="kpi-tile" style="background:linear-gradient(135deg,#7C3AED,#6D28D9)">
          <span class="kpi-icon">🌍</span><div class="kpi-label">Destinations</div><div class="kpi-value">${e.destinations.length}</div>
        </div>
      </div>`;
  } else if (carriers.length) {
    // Domestic trip with cash carriers — same idea, simpler (no currency conversion needed, it's all ₹).
    const totalCarried = carriers.reduce((sum, c) => sum + c.carriedAmount, 0);
    const totalCarrierSpent = carriers.reduce((sum, c) => sum + c.spent, 0);
    tripKpiBlock = `
      <div class="kpi-grid">
        <div class="kpi-tile" style="background:linear-gradient(135deg,#0891B2,#0E7490)">
          <span class="kpi-icon">💵</span><div class="kpi-label">Cash Carried</div><div class="kpi-value">₹${totalCarried.toFixed(0)}</div>
        </div>
        <div class="kpi-tile" style="background:linear-gradient(135deg,#EA580C,#C2410C)">
          <span class="kpi-icon">💸</span><div class="kpi-label">Spent from Cash</div><div class="kpi-value">₹${totalCarrierSpent.toFixed(0)}</div>
        </div>
        <div class="kpi-tile" style="background:linear-gradient(135deg,#16A34A,#15803D)">
          <span class="kpi-icon">🧳</span><div class="kpi-label">Remaining Cash</div><div class="kpi-value">₹${(totalCarried - totalCarrierSpent).toFixed(0)}</div>
        </div>
      </div>`;
  }
  const showBudget = eventBudgetEnabled(e);

  main.innerHTML = `
    <button class="btn-ghost btn-small" id="backToListBtn">← Back to Planning</button>
    <div class="hero-card" style="background:${t.color};margin-top:10px">
      <div class="hero-top"><span style="font-size:30px">${e.icon || t.icon}</span>
        <div class="hero-greeting"><strong>${escapeHtml(e.name)}</strong>${metaLine}</div>
      </div>
      <div class="hero-balance-label">Total Spent <span style="background:${statusBadgeColor(s.status)};padding:1px 8px;border-radius:99px;font-size:10px;margin-left:6px">${s.status}</span></div>
      ${showBudget ? `
        <div class="hero-balance">₹${s.totalSpent.toFixed(0)} <span style="font-size:16px;opacity:0.8">/ ₹${s.totalBudget.toFixed(0)}</span></div>
        <div class="progress-track" style="background:rgba(255,255,255,0.25)"><div class="progress-fill" style="width:${Math.min(pct,100)}%;background:#fff"></div></div>
        <div class="muted" style="color:#E2E8F0;margin-top:4px">${pct.toFixed(0)}% of budget used · ₹${s.remaining.toFixed(0)} remaining</div>
      ` : `
        <div class="hero-balance">₹${s.totalSpent.toFixed(0)}</div>
        <div class="muted" style="color:#E2E8F0;margin-top:4px">Budget tracking is off for this trip</div>
      `}
    </div>
    ${e.notes ? `<div class="card"><span class="muted">Notes:</span> ${escapeHtml(e.notes)}</div>` : ""}
    ${tripKpiBlock}
    <button class="btn-accent" id="editTripBtn" style="width:100%;margin-top:6px;margin-bottom:10px">✏️ Edit Trip</button>
    ${currencyBlock}

    ${carriers.length ? `<h2 class="section">Carried Currency</h2><div id="carriersView"></div>` : ""}

    <h2 class="section">Custom Fields</h2>
    <div id="customFieldsView"></div>
    <button class="btn-ghost btn-small" id="addCfBtn" style="width:100%;margin-top:4px">+ Add Custom Field</button>

    <h2 class="section">Items</h2>
    <div id="eventItemsList"></div>
    <button class="btn-ghost" id="addEventItemBtn" style="width:100%;margin-top:6px">+ Add Another Item</button>

    <h2 class="section">Linked Transactions (${s.transactions.length})</h2>
    <div class="card" id="linkedTxnList"></div>

    <button class="btn-danger" id="deleteEventBtn" style="width:100%;margin-top:16px">Delete This Event</button>
  `;
  document.getElementById("backToListBtn").onclick = () => { planningView = "list"; renderPlanning(); };
  document.getElementById("editTripBtn").onclick = () => openEditTripModal(eventId);

  if (carriers.length) {
    const carriersView = document.getElementById("carriersView");
    carriersView.innerHTML = carriers.map(c => {
      const cpct = c.carriedAmount > 0 ? (c.spent / c.carriedAmount) * 100 : 0;
      const over = c.remaining < 0;
      return `<div class="card">
        <div class="space-between">
          <strong>${escapeHtml(c.label)} (${c.currencyCode})</strong>
          <span style="color:${over ? "var(--expense)" : "var(--income)"};font-weight:700">${c.currencySymbol}${c.remaining.toFixed(0)} left</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.min(cpct,100)}%;background:${budgetColor(cpct)}"></div></div>
        <div class="muted">${c.currencySymbol}${c.spent.toFixed(0)} spent of ${c.currencySymbol}${c.carriedAmount.toFixed(0)} carried</div>
      </div>`;
    }).join("");
  }

  const cfView = document.getElementById("customFieldsView");
  if (!e.customFields || !e.customFields.length) {
    cfView.innerHTML = `<p class="muted">No custom fields yet.</p>`;
  } else {
    cfView.innerHTML = `<div class="card">${e.customFields.map(f =>
      `<div class="space-between" style="margin-bottom:4px"><span class="muted">${escapeHtml(f.name)}</span><strong>${escapeHtml(f.value)}</strong></div>`
    ).join("")}</div>`;
  }
  document.getElementById("addCfBtn").onclick = () => openAddCustomFieldModal(eventId);

  const itemsList = document.getElementById("eventItemsList");
  s.items.forEach((item, idx) => {
    const div = document.createElement("div");
    div.className = "card";
    if (showBudget) {
      const ipct = item.budget > 0 ? (item.spent / item.budget) * 100 : 0;
      div.innerHTML = `
        <div class="space-between">
          <strong>${escapeHtml(item.label)}</strong>
          <span style="color:${budgetColor(ipct)};font-weight:700">₹${item.spent.toFixed(0)} / ₹${(item.budget||0).toFixed(0)}</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.min(ipct,100)}%;background:${budgetColor(ipct)}"></div></div>
        <button class="btn-ghost btn-small" id="addExp-${idx}" style="margin-top:8px">+ Add Expense</button>
      `;
    } else {
      div.innerHTML = `
        <div class="space-between">
          <strong>${escapeHtml(item.label)}</strong>
          <span style="font-weight:700">₹${item.spent.toFixed(0)} spent</span>
        </div>
        <button class="btn-ghost btn-small" id="addExp-${idx}" style="margin-top:8px">+ Add Expense</button>
      `;
    }
    itemsList.appendChild(div);
    document.getElementById(`addExp-${idx}`).onclick = () => openAddEventExpenseModal(eventId, item.label);
  });

  const txnList = document.getElementById("linkedTxnList");
  if (!s.transactions.length) {
    txnList.innerHTML = `<p class="muted">No expenses logged yet.</p>`;
  } else {
    txnList.innerHTML = [...s.transactions].sort((a,b) => b.date.localeCompare(a.date)).map(txn => {
      const acc = getAccountById(txn.accountId);
      const carrier = txn.carrierId ? (e.carriers || []).find(c => c.id === txn.carrierId) : null;
      let fx;
      if (txn.originalCurrency) {
        // Entered in destination currency — show original + base, exactly as recorded.
        fx = ` · ${txn.originalAmount} ${txn.originalCurrency} @ ${txn.exchangeRate} ≈ ₹${txn.amount.toFixed(0)}`;
        if (carrier) fx += ` · from ${escapeHtml(carrier.label)}`;
      } else if (e.destinations && e.destinations.length === 1) {
        // Entered in base currency on a single-destination trip — show the reverse conversion too.
        const d = e.destinations[0];
        fx = ` · ≈ ${d.currencySymbol}${(txn.amount / d.rateToBase).toFixed(2)} ${d.currencyCode}`;
      } else if (e.destinations && e.destinations.length > 1) {
        // Multiple destinations — show the equivalent in every one, since we can't assume which.
        fx = " · " + e.destinations.map(d => `≈ ${d.currencySymbol}${(txn.amount / d.rateToBase).toFixed(2)}`).join(" · ");
      } else {
        fx = "";
      }
      return `<div class="txn-row">
        <div class="txn-icon">💸</div>
        <div class="txn-main">
          <div class="top"><span>${escapeHtml(txn.eventItem || "")}</span><span style="color:var(--expense)">-₹${txn.amount.toFixed(0)}</span></div>
          <div class="bottom">${txn.date} · ${acc ? escapeHtml(acc.name) : "—"}${fx}</div>
        </div>
      </div>`;
    }).join("");
  }

  document.getElementById("addEventItemBtn").onclick = () => openAddEventItemModal(eventId);
  document.getElementById("deleteEventBtn").onclick = () => {
    if (confirm(`Delete "${e.name}"? Linked transactions stay in your History, just unlinked from this event.`)) {
      deleteEvent(eventId);
      planningView = "list";
      renderPlanning();
    }
  };
}

let catType = "expense";
let newCatIcon = "🏷️";

function renderIconGrid(containerId, selected, onPick) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = ICON_CHOICES.map(icon =>
    `<button type="button" data-icon="${icon}" class="${icon === selected ? "selected" : ""}">${icon}</button>`
  ).join("");
  grid.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      grid.querySelectorAll("button").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");

function openIconPickerModal(currentIcon, onSave) {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Choose an Icon</h3>
      <div class="icon-grid" id="modalIconGrid"></div>

function truncateToWidth(ctx, text, maxWidth) {
  if (ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxWidth) t = t.slice(0, -1);
  return t + "…";
}
function drawBarChart(canvas, data) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  // Reserve room above the tallest bar for its value label, and below for the
  // category label — without this, the label on whichever bar is closest to
  // the max value gets pushed off the top edge of the canvas and disappears.
  const topMargin = 22;
  const bottomMargin = 30;
  const usableH = h - topMargin - bottomMargin;
  const max = Math.max(...data.map(d => d[1]), 1);
  const barW = w / (data.length * 2);
  const labelSlotW = barW * 1.8;
  const textColor = getComputedStyle(document.documentElement).getPropertyValue("--text").trim() || "#1A1A1A";
  ctx.font = "11px sans-serif";
  ctx.textAlign = "center";
  data.forEach(([label, value, color], i) => {
    const barH = Math.max((value / max) * usableH, 0);
    const x = (i * 2 + 0.5) * barW;
    const barTopY = h - bottomMargin - barH;
    ctx.fillStyle = color;
    ctx.fillRect(x, barTopY, barW, barH);
    ctx.fillStyle = textColor;
    ctx.font = "11px sans-serif";
    ctx.fillText(truncateToWidth(ctx, label, labelSlotW), x + barW/2, h - 12);
    ctx.fillText("₹" + value.toFixed(0), x + barW/2, Math.max(barTopY - 6, 14));
  });
}
function drawPieChart(canvas, data) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  const total = data.reduce((s,d) => s + d[1], 0) || 1;
  const cx = w/2, cy = h/2, r = Math.min(w,h)/2 - 8;
  let start = -Math.PI/2;
  data.forEach(([label, value, color]) => {
    const angle = (value/total) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, start + angle);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    start += angle;
  });
}

/* ---------- Exports: CSV of raw data, and a full printable report ---------- */
function downloadCsv(txns) {
  const header = ["Date","Type","Category","Account","Payment Method","Amount","Note"];
  const rows = [...txns].sort((a,b) => a.date.localeCompare(b.date)).map(t => {
    const cat = getCategoryById(t.categoryId);
    const acc = getAccountById(t.accountId);
    return [t.date, t.type, cat ? cat.name : "", acc ? acc.name : "", t.paymentMethod || "", t.amount, (t.note || "").replace(/,/g, ";")];
  });
  let csv = [header, ...rows].map(r => r.join(",")).join("\n");

  const bankWise = bankWiseDetails(reportFrom, reportTo);
  if (bankWise.length) {
    csv += "\n\nBank-wise Summary\nAccount,Income,Expense,Balance,Entries\n";
    csv += bankWise.map(b => [b.account.name, b.income, b.expense, b.balance, b.count].join(",")).join("\n");
  }

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `myfinance-${reportFrom}_to_${reportTo}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
